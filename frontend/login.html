<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/frontend/CSS/usuario.css">
    <title>Agenda</title>
</head>
<body>
    <main>
        <section class="principal_login">
            <div class="imagem">
                <a href="/frontend/agenda.html"><img src="/frontend/assets/icons8-à-esquerda-dentro-de-um-círculo-50.png" alt="seta para a esquerda"></a>
                <h1>Login</h1>
                <a href="/frontend/agenda.html"><img src="/frontend/assets/icons8-calendário-64.png" alt="imagem de um calendario"></a>
            </div>
            <form id="login"> 
                <p>Faça seu login</p>
                <label for="email"></label>
                <input type="email" class="email" id="email" name="email" required placeholder="E-mail">
                <label for="senha"></label>
                <input type="password" class="senha" id="senha" name="senha" required placeholder="Senha">
                <div class="bot_login">
                    <button type="submit" class="button_login">Entrar</button>
                    <a href="/frontend/cadastro.html">Cadastre-se</a>
            </div>
            </form>
        </section>
    </main>
    <script src="/frontend/JS/usuario.js"></script>
</body>
</html>
